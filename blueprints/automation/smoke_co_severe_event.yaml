blueprint:
  name: Smoke/CO Detected Notification
  description: >-
    Send an urgent notification the moment a smoke or carbon monoxide sensor
    trips. Built for HomeKit-paired alarms (e.g. First Alert Onelink Safe &
    Sound via homekit_controller_pro) but works with any binary_sensor using
    the standard "smoke" or "carbon_monoxide" device class.
  domain: automation
  source_url: https://github.com/trooperthorn/ha-homekit-pro/blob/master/blueprints/automation/smoke_co_severe_event.yaml
  input:
    smoke_sensors:
      name: Smoke sensor(s)
      description: Leave empty to skip smoke detection.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: smoke
          multiple: true
    co_sensors:
      name: Carbon monoxide sensor(s)
      description: Leave empty to skip CO detection.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: carbon_monoxide
          multiple: true
    notify_target:
      name: Notify target
      description: The notify entity to send the alert to (e.g. a mobile app or a notify group).
      selector:
        entity:
          domain: notify

triggers:
  - trigger: state
    entity_id: !input smoke_sensors
    to: "on"
    id: smoke
  - trigger: state
    entity_id: !input co_sensors
    to: "on"
    id: co

conditions: []

actions:
  - action: notify.send_message
    target:
      entity_id: !input notify_target
    data:
      title: >-
        {{ "Smoke detected" if trigger.id == "smoke" else "Carbon monoxide detected" }}
      message: >-
        {{ trigger.to_state.attributes.friendly_name }} tripped at
        {{ trigger.to_state.last_changed.strftime("%-I:%M %p") }}.

mode: parallel
max_exceeded: silent
