[pytest]
asyncio_mode = auto
# pytest-homeassistant-custom-component auto-registers as a pytest11 plugin
# just by being installed, and importing it pulls in homeassistant.runner,
# which imports the Unix-only `fcntl` module -- breaks pytest entirely on
# Windows. Current tests don't use its `hass` fixture (they test entity
# logic directly against real captured HAP data via a lightweight stub, see
# tests/conftest.py), so disable auto-load. Re-enable (drop this line) once
# hass-based tests are added, running them under WSL/Linux/CI rather than
# native Windows.
addopts = -p no:homeassistant
